[metadata]
name = wechat-agent
version = 0.1.0
description = Local macOS WeChat 4.x database decrypt and export helpers

[options]
packages = find:
python_requires = >=3.9
install_requires =
    pycryptodome>=3.20
    zstandard>=0.23

[options.entry_points]
console_scripts =
    wechat-agent = wechat_agent.cli:main

