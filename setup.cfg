[metadata]
name = wechat-agent
version = 0.1.0
description = A local, citation-backed knowledge assistant for searching and tracking information across WeChat conversations.
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.9
install_requires =
    pycryptodome>=3.20
    zstandard>=0.23

[options.entry_points]
console_scripts =
    wechat-agent = wechat_agent.cli:main
