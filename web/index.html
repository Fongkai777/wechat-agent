<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WeChat Agent</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="brand-title">WeChat <span>Agent</span></div>
        <nav class="main-tabs" aria-label="主视图">
          <button class="main-tab active" data-view="raw">聊天内容</button>
          <button class="main-tab" data-view="qa">聊天问答</button>
          <button class="main-tab" data-view="goals">任务助手</button>
          <button class="main-tab" data-view="rag">RAG 配置</button>
          <button class="main-tab" data-view="settings">模型配置</button>
        </nav>
      </header>

      <section id="rawView" class="view active">
        <div id="rawShell" class="shell">
          <aside id="rawSidebar" class="sidebar">
            <div class="topbar page-header">
              <div class="page-heading-block">
                <h1 class="page-heading">聊天内容</h1>
                <p id="statusLine" class="page-subtitle">载入中</p>
              </div>
              <button id="refreshBtn" class="sync-btn" type="button" title="同步最新消息">
                <img src="/static/icons/refresh-cw.svg" width="16" height="16" alt="" />
                <span>同步最新消息</span>
              </button>
            </div>
            <div class="sync-toolbar">
              <div class="sync-status-block" role="status" aria-live="polite">
                <span id="syncStatus" class="sync-status" data-state="loading">检查同步状态</span>
                <span id="syncTime" class="sync-time"></span>
              </div>
            </div>
            <label class="search">
              <img src="/static/icons/search.svg" width="15" height="15" alt="" />
              <input id="searchInput" type="search" placeholder="搜索联系人或群聊" aria-label="搜索联系人或群聊" autocomplete="off" />
            </label>
            <div id="chatList" class="chat-list"></div>
            <div id="sidebarResizeHandle" class="sidebar-resize-handle" role="separator" tabindex="0"
                 aria-label="聊天列表宽度" aria-orientation="vertical" aria-controls="rawSidebar"
                 aria-valuemin="280" aria-valuemax="640" aria-valuenow="320"
                 title="拖动调整宽度，双击恢复默认"></div>
          </aside>

          <section class="conversation">
            <header class="conversation-header">
              <div>
                <h2 id="chatTitle">选择一个聊天</h2>
                <p id="chatMeta"></p>
              </div>
              <button id="latestMessagesBtn" class="subtle-btn latest-messages" type="button" hidden>查看最新消息</button>
            </header>
            <div id="messagePane" class="message-pane">
              <div class="empty-state">从左侧选择会话</div>
            </div>
          </section>
        </div>
      </section>

      <section id="qaView" class="view qa-view">
        <div class="qa-workspace">
          <aside class="qa-sidebar">
            <div class="qa-sidebar-header page-header">
              <h1 class="page-heading">聊天问答</h1>
              <button id="qaNewBtn" class="subtle-btn" type="button">新建对话</button>
            </div>
            <div id="qaConversationList" class="qa-conversation-list"></div>
          </aside>
          <div class="qa-shell">
            <header class="tool-header">
              <div>
                <h2 id="qaTitle" class="conversation-title">新对话</h2>
                <p id="qaMeta">使用全部已解析聊天内容</p>
                <p id="qaHistoryStatus" class="qa-history-summary" role="status" hidden></p>
              </div>
            </header>
            <section id="qaMessages" class="qa-messages">
              <div class="qa-empty">问一个关于聊天记录的问题</div>
            </section>
            <div id="qaProgress" class="qa-progress"></div>
            <form id="qaForm" class="qa-form">
              <textarea id="qaQuestion" rows="1" placeholder="问一个关于聊天记录的问题"></textarea>
              <button id="qaAskBtn" type="submit" aria-label="发送" title="发送">↑</button>
            </form>
          </div>
        </div>
      </section>

      <section id="ragView" class="view rag-view">
        <div class="rag-shell">
          <header class="tool-header rag-header page-header">
            <div class="page-heading-block">
              <h1 class="page-heading">RAG 配置</h1>
              <p id="ragMeta" class="page-subtitle">检查索引与路由</p>
            </div>
            <div class="rag-prepare-actions">
              <span id="ragPrepareStatus" role="status" aria-live="polite"></span>
              <button id="ragPrepareBtn" type="button">一键准备检索</button>
              <button id="ragPrepareStopBtn" class="subtle-btn" type="button" disabled>停止</button>
            </div>
          </header>

          <form id="ragScheduleForm" class="rag-schedule">
            <div class="rag-schedule-controls">
              <label class="rag-schedule-toggle">
                <input id="ragScheduleEnabled" class="goal-toggle" type="checkbox" role="switch" disabled />
                <span>定时更新</span>
              </label>
              <div class="rag-schedule-interval">
                <span>每</span>
                <input id="ragScheduleValue" type="number" min="1" max="365" step="1" value="1" aria-label="自动更新周期" required disabled />
                <select id="ragScheduleUnit" aria-label="自动更新周期单位" disabled>
                  <option value="hours">小时</option>
                  <option value="days" selected>天</option>
                </select>
              </div>
              <button id="ragScheduleSaveBtn" type="submit" disabled>保存</button>
              <span id="ragScheduleFeedback" role="status" aria-live="polite"></span>
            </div>
            <div id="ragScheduleStatus" class="rag-schedule-status" role="status">正在读取定时设置</div>
          </form>

          <section class="rag-workflow" aria-label="检索准备流程">
            <section class="rag-status-tile rag-voice-stage">
              <div class="rag-stage-heading"><span class="rag-step">1</span><h2>语音转文字</h2></div>
              <strong id="voiceBatchCount">已转写 - / -</strong>
              <div class="rag-card-detail">
                <small id="voicePendingCount">正在统计本地语音</small>
                <small id="voiceBatchStatus" role="status" aria-live="polite"></small>
              </div>
              <div class="rag-card-actions">
                <button id="voiceTranscribeAllBtn" type="button" title="仅转写尚未保存文字的本地语音">一键转文字所有语音</button>
                <button id="voiceStopBatchBtn" class="subtle-btn" type="button" disabled>停止</button>
              </div>
            </section>
            <div id="ragStatusGrid" class="rag-status-grid"></div>
          </section>
          <details id="voiceBatchDetails" class="rag-voice-log" hidden>
            <summary>语音转写日志</summary>
            <div id="voiceBatchLog" class="voice-batch-log"></div>
          </details>

          <section class="rag-console">
            <section class="rag-log-panel">
              <div class="rag-section-title">索引日志</div>
              <div id="ragLog" class="rag-log"></div>
            </section>
            <form id="ragSearchForm" class="rag-search-form">
              <label class="rag-debug-question">
                检索调试
                <textarea id="ragQuestion" rows="3" placeholder="输入一个问题，查看路由、召回、排序和入模片段"></textarea>
              </label>
              <label class="rag-debug-limit">
                <span>调试片段数</span>
                <input id="ragLimit" type="number" min="8" max="160" step="1" value="60" title="仅用于本次检索调试，不改变聊天问答的检索条数" />
              </label>
              <button id="ragSearchBtn" type="submit">运行检索</button>
            </form>
          </section>

          <div class="rag-results-grid">
            <section id="ragRoute" class="rag-route"></section>
            <section id="ragSources" class="rag-sources"></section>
          </div>
        </div>
      </section>

      <section id="goalsView" class="view goals-view">
        <div class="goals-shell">
          <header class="goals-header page-header">
            <div class="page-heading-block"><h1 class="page-heading">任务助手</h1><p id="goalsMeta" class="page-subtitle" role="status">正在读取任务</p></div>
            <button id="goalNewBtn" class="goal-primary" type="button"><img src="/static/icons/plus.svg" alt="" />新增任务</button>
          </header>
          <div id="goalsError" class="goal-error" role="alert" hidden></div>
          <div id="goalsGrid" class="goals-grid">
            <div id="goalEditorRow" class="goal-row" hidden>
              <article id="goalEditor" class="goal-card goal-editor" aria-labelledby="goalEditorTitle" hidden>
                <form id="goalForm">
                  <header class="goal-editor-header"><h2 id="goalEditorTitle">新增任务</h2><button id="goalCancelIcon" class="goal-icon" type="button" aria-label="取消编辑" title="取消编辑"><img src="/static/icons/x.svg" alt="" /></button></header>
                  <label>任务<textarea id="goalPrompt" required maxlength="3000" rows="3"></textarea></label>
                  <div class="goal-timing-field">
                    <label for="goalIntervalValue">检索周期</label>
                    <div class="goal-timing-controls">
                      <span>每</span>
                      <input id="goalIntervalValue" aria-label="周期数量" type="number" min="1" max="365" step="1" value="1" required />
                      <select id="goalIntervalUnit" aria-label="周期单位"><option value="hours">小时</option><option value="days">天</option></select>
                    </div>
                  </div>
                  <div class="goal-timing-field">
                    <label for="goalRangeValue">检索范围</label>
                    <div class="goal-timing-controls">
                      <span>最近</span>
                      <input id="goalRangeValue" aria-label="检索数量" type="number" min="1" max="90" step="1" value="1" required />
                      <select id="goalRangeUnit" aria-label="时间单位"><option value="days">天</option><option value="weeks">周</option><option value="months">月</option></select>
                    </div>
                  </div>
                  <p id="goalFormError" class="goal-error" role="alert" hidden></p>
                  <footer class="goal-editor-footer"><span></span><button id="goalCancelBtn" type="button" class="goal-secondary">取消</button><button id="goalSaveBtn" type="submit" class="goal-primary">保存</button></footer>
                </form>
              </article>
              <section id="goalEditorResult" class="goal-output" aria-label="执行结果" hidden></section>
            </div>
            <div id="goalCards" class="goal-cards"></div>
          </div>
        </div>
      </section>

      <dialog id="goalHistory" class="goal-dialog goal-history-dialog" aria-labelledby="goalHistoryTitle">
        <header class="goal-dialog-header"><h2 id="goalHistoryTitle">执行记录</h2><button class="goal-icon" type="button" data-close-goal="goalHistory" aria-label="关闭" title="关闭"><img src="/static/icons/x.svg" alt="" /></button></header>
        <div class="goal-history-layout">
          <nav id="goalRunList" class="goal-history-list" aria-label="历史执行记录"></nav>
          <div id="goalRunContent" class="goal-history-content" role="region" aria-label="所选执行结果"></div>
        </div>
      </dialog>

      <section id="settingsView" class="view settings-view">
        <div class="tool-panel settings-panel">
          <header class="tool-header page-header">
            <div class="page-heading-block">
              <h1 class="page-heading">模型配置</h1>
              <p id="settingsStatus" class="page-subtitle" role="status">载入中</p>
            </div>
          </header>
          <form id="llmConfigForm" class="settings-form">
            <section class="config-section" aria-labelledby="voiceConfigHeading">
              <header class="config-heading"><span class="config-number" aria-hidden="true">01</span><h2 id="voiceConfigHeading">语音转文字</h2></header>
              <div class="config-fields">
              <label>Base URL<input id="voiceBaseUrl" autocomplete="off" /></label>
              <label>模型<input id="voiceModel" autocomplete="off" /></label>
              <label>API Key<input id="voiceApiKey" type="password" autocomplete="off" placeholder="留空则保留已保存值" /></label>
              <label>环境变量<input id="voiceApiKeyEnv" autocomplete="off" /></label>
              </div>
            </section>
            <section class="config-section" aria-labelledby="qaConfigHeading">
              <header class="config-heading"><span class="config-number" aria-hidden="true">02</span><h2 id="qaConfigHeading">聊天问答</h2></header>
              <div class="config-fields">
              <label>Base URL<input id="qaBaseUrl" autocomplete="off" /></label>
              <label>模型<input id="qaModel" autocomplete="off" /></label>
              <label>API Key<input id="qaApiKey" type="password" autocomplete="off" placeholder="留空则保留已保存值" /></label>
              <label>环境变量<input id="qaApiKeyEnv" autocomplete="off" /></label>
              <label>温度<input id="qaTemperature" type="number" min="0" max="2" step="0.1" /></label>
              <label>检索条数<input id="qaContextLimit" type="number" min="8" max="160" step="1" /></label>
              </div>
            </section>
            <section class="config-section" aria-labelledby="taskConfigHeading">
              <header class="config-heading"><span class="config-number" aria-hidden="true">03</span><h2 id="taskConfigHeading">任务助手</h2></header>
              <div class="config-fields">
              <label>Base URL<input id="taskBaseUrl" autocomplete="off" /></label>
              <label>模型<input id="taskModel" autocomplete="off" /></label>
              <label>API Key<input id="taskApiKey" type="password" autocomplete="off" placeholder="留空则保留已保存值" /></label>
              <label>环境变量<input id="taskApiKeyEnv" autocomplete="off" /></label>
              </div>
            </section>
            <section class="config-section" aria-labelledby="embeddingConfigHeading">
              <header class="config-heading"><span class="config-number" aria-hidden="true">04</span><h2 id="embeddingConfigHeading">Embedding 检索</h2></header>
              <div class="config-fields">
              <label class="settings-checkbox">启用<input id="embeddingEnabled" type="checkbox" /></label>
              <label>Base URL<input id="embeddingBaseUrl" autocomplete="off" placeholder="留空继承问答 Base URL" /></label>
              <label>模型<input id="embeddingModel" autocomplete="off" /></label>
              <label>API Key<input id="embeddingApiKey" type="password" autocomplete="off" placeholder="留空继承问答 API Key" /></label>
              <label>环境变量<input id="embeddingApiKeyEnv" autocomplete="off" placeholder="留空继承问答环境变量" /></label>
              <label>向量维度<input id="embeddingDimensions" type="number" min="0" max="3072" step="1" /></label>
              <label>批量大小<input id="embeddingBatchSize" type="number" min="1" max="128" step="1" /></label>
              <label>召回块数<input id="embeddingQueryCandidates" type="number" min="10" max="300" step="1" /></label>
              </div>
            </section>
            <section class="config-section" aria-labelledby="rerankConfigHeading">
              <header class="config-heading"><span class="config-number" aria-hidden="true">05</span><h2 id="rerankConfigHeading">Rerank 重排</h2></header>
              <div class="config-fields">
              <label class="settings-checkbox">启用<input id="rerankEnabled" type="checkbox" /></label>
              <label>Base URL<input id="rerankBaseUrl" autocomplete="off" placeholder="留空继承问答 Base URL" /></label>
              <label>模型<input id="rerankModel" autocomplete="off" /></label>
              <label>API Key<input id="rerankApiKey" type="password" autocomplete="off" placeholder="留空继承问答 API Key" /></label>
              <label>环境变量<input id="rerankApiKeyEnv" autocomplete="off" placeholder="留空继承问答环境变量" /></label>
              <label>候选数量<input id="rerankCandidateLimit" type="number" min="8" max="120" step="1" /></label>
              </div>
            </section>
            <footer class="settings-actions"><button id="saveLlmConfigBtn" type="submit">保存配置</button></footer>
          </form>
        </div>
      </section>
    </main>
    <script id="appBootstrap">
      (() => {
        // Inline so a failed external script cannot disable its own recovery.
        const scripts = ["/static/sidebar.js", "/static/jobs.js", "/static/app.js", "/static/goals.js"];
        let index = 0, loading = false, timer = null, failures = 0;
        function loadNext() {
          if (loading || index === scripts.length) return;
          clearTimeout(timer);
          timer = null;
          loading = true;
          const script = document.createElement("script");
          script.src = scripts[index];
          script.onload = () => {
            script.onload = script.onerror = null;
            loading = false;
            failures = 0;
            index++;
            loadNext();
          };
          script.onerror = () => {
            script.onload = script.onerror = null;
            script.remove();
            loading = false;
            if (index <= 2) {
              document.querySelector("#statusLine").textContent = "等待连接";
              const status = document.querySelector("#syncStatus");
              status.textContent = "页面资源加载失败，正在重试";
              status.dataset.state = "warning";
              status.title = `暂时无法加载 ${scripts[index]}；服务恢复后会自动继续`;
            }
            timer = setTimeout(loadNext, Math.min(1000 * 2 ** failures++, 15000));
          };
          document.body.appendChild(script);
        }
        const assetTimers = new WeakMap();
        function retryAsset(asset) {
          const attr = asset.tagName === "IMG" ? "src" : asset.tagName === "LINK" && asset.rel === "stylesheet" ? "href" : null;
          const url = attr && asset.getAttribute(attr);
          if (!url || !url.startsWith("/static/") || assetTimers.has(asset)) return;
          const attempt = Number(asset.dataset.loadAttempts || 0) + 1;
          asset.dataset.loadAttempts = String(attempt);
          assetTimers.set(asset, setTimeout(() => {
            assetTimers.delete(asset);
            if (!asset.isConnected || (attr === "src" ? asset.naturalWidth > 0 : asset.sheet)) return;
            asset.setAttribute(attr, `${url.split("?")[0]}?asset_retry=${attempt}`);
          }, Math.min(1000 * 2 ** Math.min(attempt - 1, 4), 15000)));
        }
        document.addEventListener("error", event => retryAsset(event.target), true);
        for (const asset of document.querySelectorAll('img[src^="/static/"], link[rel="stylesheet"]')) {
          if (asset.tagName === "IMG" ? asset.complete && !asset.naturalWidth : !asset.sheet) retryAsset(asset);
        }
        window.addEventListener("online", loadNext);
        loadNext();
      })();
    </script>
  </body>
</html>
